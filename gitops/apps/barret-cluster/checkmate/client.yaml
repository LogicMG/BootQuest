apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkmate-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkmate-client
  template:
    metadata:
      labels:
        app: checkmate-client
    spec:
      containers:
        - name: client
          image: ghcr.io/bluewave-labs/checkmate-client:v3.2.0
          ports:
            - containerPort: 80
          env:
            - name: UPTIME_APP_API_BASE_URL
              value: "https://status.logicmg.fr/api/v1"
            - name: UPTIME_APP_CLIENT_HOST
              value: "https://status.logicmg.fr"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: config-volume
          configMap:
            name: checkmate-server-nginx-cm
---
apiVersion: v1
kind: Service
metadata:
  name: checkmate-client
spec:
  selector:
    app: checkmate-client
  ports:
    - port: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: checkmate-server-nginx-cm
data:
  default.conf: |
    server {
      listen       80;
      listen  [::]:80;

      server_name checkmate-demo.bluewavelabs.ca;
      server_tokens off;

      location /.well-known/acme-challenge/ {
          root /var/www/certbot;
      }

      location / {
          root   /usr/share/nginx/html;
          index  index.html index.htm;
          try_files $uri $uri/ /index.html;
      }

      # location /api/ {
      #     proxy_pass http://status.logicmg.fr:5000/api/;
      #     proxy_http_version 1.1;
      #     proxy_set_header Host $host;
      #     proxy_set_header X-Real-IP $remote_addr;
      #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      #     proxy_set_header X-Forwarded-Proto $scheme;
      # }

      location /api-docs/ {
          proxy_pass http://status.logicmg.fr:5000/api-docs/;
          proxy_http_version 1.1;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
